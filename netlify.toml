# Netlify detects Next.js and runs it with its own runtime (server pages,
# server actions, image optimisation). Secrets are set in the Netlify UI:
# AUTH_SECRET, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, UPLOAD_STORAGE=netlify.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Not secrets: UPLOAD_STORAGE is the word "netlify" and the database
  # address is useless without its token. Scanning them only raises false alarms.
  SECRETS_SCAN_OMIT_KEYS = "UPLOAD_STORAGE,TURSO_DATABASE_URL"
